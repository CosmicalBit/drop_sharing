[package]
name = "drop-sharing"
version = "0.1.0"
edition = "2024"

[profile.fuzz]
inherits = "release"
debug = 1
lto = false
strip = false
opt-level = 2

[profile.release]
lto = "fat"
opt-level = 3
strip = "symbols"

[dependencies]
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
hostname = "0.4.2"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = {version = "0.3.2",features = ["getrandom","zeroize"]}
notify-rust = "4.18.0"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
wpactrl = "0.5.1"
zeroize = "1.9.0"

[dev-dependencies]
bolero = "0.13.4"
proptest = "1.11.0"
