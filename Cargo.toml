[package]
name = "drop-sharing"
version = "0.1.0"
edition = "2024"

[profile.fuzz]
inherits = "release"
debug = 1
lto = false
strip = false
opt-level = 2

[profile.release]
lto = "fat"
opt-level = 3
strip = "symbols"

[dependencies]
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_material_icons = "0.8.0"
hostname = "0.4.2"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = {version = "0.3.2",features = ["getrandom","zeroize"]}
notify-rust = "4.18.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rfd = "0.17.2"
serde = "1.0.229"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tui-textarea = "0.7.0"
wpactrl = "0.5.1"
zeroize = "1.9.0"

[dev-dependencies]
bolero = "0.13.4"
proptest = "1.11.0"
