[package]
name = "drop-sharing"
version = "0.1.0"
edition = "2024"


[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
hostname = "0.4.2"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
